[project]
name = "caja-ahorro-api"
version = "0.1.0"
description = "API demo para una caja de ahorro y crédito comunitaria de Ecuador"
requires-python = ">=3.12"
license = "MIT"

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["B008"]  # Depends() en los parámetros es el patrón de FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:JWT_SECRET"]
